# The logging of a program built with JToolsFramework (java.util.logging), unless it carries its own
# /logging.properties or the JVM names a file (-Djava.util.logging.config.file=...); --log-level LEVEL adjusts one run.
#
# What each level shows:
#   SEVERE   a startup failure, a request the server could not answer
#   INFO     start, stop, the requests refused with their reason (the default)
#   FINE     every request with its status
#   FINER, FINEST, ALL   the JDK's own loggers too, when set on the root (.level)

handlers = java.util.logging.ConsoleHandler

# The root level applies to the JDK's loggers (com.sun.net.httpserver, ...); the org.jtools classes have their own.
.level = INFO
org.jtools.level = INFO

# One line per record: date time LEVEL logger - message, the stack trace below when there is one.
java.util.logging.ConsoleHandler.level = ALL
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format = %1$tF %1$tT %4$-7s %3$s - %5$s%6$s%n
