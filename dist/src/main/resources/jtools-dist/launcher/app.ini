# ${jtools.app.name}: the installation's settings, read when the program starts — this file next to ${jtools.app.id}.jar.
# One "name=value" per line; a line starting with # is a comment. The command line comes before this file, for a run;
# the port chosen from the page's Settings menu comes before this file's too.
#
# port        the port the server listens on (${jtools.app.port} when nothing says otherwise; 0 for any free one)
# host        the interface it listens on: 127.0.0.1, this computer only (the default); 0.0.0.0 serves the network
# log.level   SEVERE, WARNING, INFO (the default), FINE (every request)
# log.folder  where the log is kept (default: ~/.${jtools.app.id}/logs); none: the console only
port=${jtools.app.port}
