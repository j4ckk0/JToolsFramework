<header>
  <h1>{{ about()?.name ?? '__APP_NAME__' }}</h1>
</header>

<main>
  @if (error(); as error) {
    <p class="error">{{ error }} Start the program again (scripts/linux/run.sh, or scripts\windows\run.bat), then reload this page.</p>
  }
  <router-outlet />
</main>

<footer>
  @if (about(); as about) {
    <span>{{ about.name }} {{ about.version }}</span>
  }
</footer>
