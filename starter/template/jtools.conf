# What the managed scripts (scripts/linux/*.sh, scripts/windows/*.bat) know of this project: KEY=VALUE lines, # comments, a value is the
# rest of its line. doc/DEVKIT.md in JToolsFramework says what each key does.
APP_ID=__APP_ID__
APP_NAME=__APP_NAME__
APP_MODULE=app
BUILD_GOALS=clean package
# the devkit scripts/linux/jtools sync takes the managed files from: this version, fetched from ~/.m2 or Maven Central
JTOOLS_VERSION=__JTOOLS_VERSION__
# a clone of JToolsFramework to take them from instead, as its working tree is (relative to this project, or absolute)
# JTOOLS_HOME=../JToolsFramework
