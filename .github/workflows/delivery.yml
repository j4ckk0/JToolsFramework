# The delivery, tried as a developer gets it: built on Linux, then installed on Linux and on Windows, where it makes a
# project, builds and packages it, and finds it in line with its devkit (jtools sync --check). A project made on
# Windows by the .bat scripts must be the one Linux's shell scripts make, but for its line endings.
name: delivery

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: external/downloads
          key: externals-${{ hashFiles('externals.conf') }}
      - name: The externals
        run: scripts/linux/setup.sh
      - name: The delivery
        run: scripts/delivery.sh --untagged -DskipTests
      - uses: actions/upload-artifact@v6
        with:
          name: delivery
          path: |
            releases/delivery/*.tar.gz
            releases/delivery/*.zip
          if-no-files-found: error

  linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: delivery
      - name: git's identity, for the projects' first commits
        run: git config --global user.name "JToolsFramework CI" && git config --global user.email "ci@example.invalid"
      - name: Install, and make a project (install.sh)
        run: |
          tar xzf jtools-*.tar.gz
          jtools-*/install.sh Demo --dir "$RUNNER_TEMP/demo" --port 18096
      - name: Its CI, its distributions, its sync
        working-directory: ${{ runner.temp }}/demo
        run: scripts/linux/ci.sh && scripts/linux/package.sh && scripts/linux/jtools sync --check && ls -l releases/
      - name: A project whose poms say their version, with no ${revision} - package.sh reads the root pom's own
        working-directory: ${{ runner.temp }}/demo
        run: |
          sed -i -e 's/\${revision}/0.1.0/g' -e '/<revision>/d' pom.xml */pom.xml
          if grep -q revision pom.xml; then echo "pom.xml still names a revision"; exit 1; fi
          scripts/linux/package.sh -q -DskipTests
          ls -l releases/demo-0.1.0-linux.tar.gz releases/demo-0.1.0-windows.zip
          git checkout -- .
      - name: Options jtools.conf declares - package.sh --quick adds its Maven arguments, checks and cleans its archives
        working-directory: ${{ runner.temp }}/demo
        run: |
          printf 'PACKAGE_OPTION=quick -DskipTests\nPACKAGE_ARCHIVES=quick -quick.txt\n' >> jtools.conf
          echo old > releases/demo-0.0.9-quick.txt && echo made > releases/demo-0.1.0-quick.txt
          scripts/linux/package.sh --quick -Djtools.ci.probe=a=b -q | tee "$RUNNER_TEMP/quick.log"
          grep -q -- '--quick: demo-0.1.0-quick.txt' "$RUNNER_TEMP/quick.log"
          [ ! -e releases/demo-0.0.9-quick.txt ] && [ -e releases/demo-0.1.0-quick.txt ]
          if compgen -G '*/target/surefire-reports' > /dev/null; then echo "tests ran: -DskipTests did not reach Maven"; exit 1; fi
          rm releases/demo-0.1.0-quick.txt
          if scripts/linux/package.sh --quick -q > "$RUNNER_TEMP/quick.log" 2>&1; then echo "a missing declared archive passed"; exit 1; fi
          grep -q 'no releases/demo-0.1.0-quick.txt: --quick makes it' "$RUNNER_TEMP/quick.log"
          git checkout -- .
      - name: A project's files as Linux makes them, for Windows to compare
        run: ~/.local/bin/jtools new Demo --dir "$RUNNER_TEMP/fresh" --port 18096 --no-git --no-build
      - name: Without git, a project without a repository
        run: |
          mkdir nogit && for f in /usr/bin/*; do [ "${f##*/}" = git ] || ln -s "$f" nogit/; done
          env -i PATH="$PWD/nogit" HOME="$HOME" "$HOME/.local/bin/jtools" new NoGit --dir "$RUNNER_TEMP/nogit" --no-build
          [ ! -e "$RUNNER_TEMP/nogit/.git" ] && [ -f "$RUNNER_TEMP/nogit/pom.xml" ]
      - uses: actions/upload-artifact@v6
        with:
          name: made-on-linux
          path: ${{ runner.temp }}/fresh
          include-hidden-files: true
          if-no-files-found: error
      - name: A project made with 1.3.1, moved to 1.4's layout by its own scripts/jtools sync
        run: |
          version=$(cat jtools-*/VERSION)   # the delivery under test, before 1.3.1's is unpacked beside it
          curl -fsSLO https://github.com/j4ckk0/JToolsFramework/releases/download/v1.3.1/jtools-1.3.1.tar.gz && tar xzf jtools-1.3.1.tar.gz
          jtools-1.3.1/install.sh --no-project > /dev/null   # 1.3.1's devkit, as a developer on 1.3.1 has it
          jtools-1.3.1/jtools new Old --dir "$RUNNER_TEMP/old" --port 18095 --no-git --no-build
          cd "$RUNNER_TEMP/old"
          test -f scripts/run.sh
          sed -i "s/^JTOOLS_VERSION=.*/JTOOLS_VERSION=$version/" jtools.conf
          sed -i "s|<version>1.3.1</version>|<version>$version</version>|" pom.xml
          scripts/jtools sync
          test -f scripts/linux/run.sh && test -f scripts/windows/run.bat && test -f scripts/linux/jtools && test ! -e scripts/run.sh && test ! -e scripts/run.bat
          rm scripts/jtools scripts/jtools.bat
          scripts/linux/jtools sync --check
          JTOOLS_DOWNLOADS="$RUNNER_TEMP/demo/external/downloads" scripts/linux/setup.sh > /dev/null
          scripts/linux/build.sh -q

  windows:
    needs: linux
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      REPORT: ${{ github.workspace }}\framework\.github\report-failure.bat
    steps:
      - uses: actions/checkout@v5   # .github alone: its report-failure.bat
        with:
          path: framework
          sparse-checkout: .github
      - uses: actions/download-artifact@v7
        with:
          name: delivery
      - uses: actions/download-artifact@v7
        with:
          name: made-on-linux
          path: made-on-linux
      - name: report-failure.bat makes one annotation of a log's last 60 lines
        run: |
          $lines = @('first line') + (1..70 | ForEach-Object { "line $_" }) + @('', '50% done, a <tag> & a | pipe', 'last line')
          Set-Content -Path report-test.log -Value $lines
          $out = (& $env:REPORT 'self-test' report-test.log) -join ''
          $ok = $out.StartsWith('::error title=self-test::') -and $out.Contains('%0A%0A50%25 done, a <tag> & a | pipe%0Alast line%0A') -and -not $out.Contains('first line') -and $out.Contains('line 14%0A') -and -not $out.Contains('line 13%0A')
          if (-not $ok) { Write-Output "::error title=report-failure.bat::its output: $($out.Replace('%', '%25'))"; exit 1 }
      - name: git's identity, for the projects' first commits
        run: git config --global user.name "JToolsFramework CI"; git config --global user.email "ci@example.invalid"
      # Each step runs the .bat scripts in cmd, as a developer would; when one fails, report-failure.bat makes its
      # output's end the step's error annotation.
      - name: The machine's Maven settings, should a build not find the framework
        run: |
          Write-Output "M2_REPO=$env:M2_REPO MAVEN_OPTS=$env:MAVEN_OPTS USERPROFILE=$env:USERPROFILE HOME=$env:HOME"
          foreach ($f in "$env:USERPROFILE\.m2\settings.xml", "$env:ProgramData\m2\settings.xml") { if (Test-Path $f) { Write-Output "== $f"; Get-Content $f } }
      - name: Install, and make a project (install.bat)
        run: |
          $ErrorActionPreference = 'Continue'
          Expand-Archive -Path (Get-Item jtools-*.zip).FullName -DestinationPath .
          $delivery = (Get-Item jtools-* -Exclude *.zip, *.gz).FullName
          cmd /c "`"$delivery\install.bat`" Demo --dir `"$env:RUNNER_TEMP\demo`" --port 18096" 2>&1 | Tee-Object -FilePath step.log
          if ($LASTEXITCODE -ne 0) { & $env:REPORT install.bat step.log; exit 1 }
      - name: Its build, its distributions, its sync (the .bat scripts)
        working-directory: ${{ runner.temp }}\demo
        run: |
          $ErrorActionPreference = 'Continue'
          foreach ($command in 'scripts\windows\build.bat', 'scripts\windows\package.bat', 'scripts\windows\jtools.bat sync --check', "`"$env:USERPROFILE\.local\bin\jtools.bat`" version") {
            cmd /c $command 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\step.log"
            if ($LASTEXITCODE -ne 0) { & $env:REPORT ($command -replace '"', '') "$env:RUNNER_TEMP\step.log"; exit 1 }
          }
          Get-ChildItem releases
      - name: A project whose poms say their version, with no ${revision} - package.bat reads the root pom's own
        working-directory: ${{ runner.temp }}\demo
        run: |
          $ErrorActionPreference = 'Continue'
          foreach ($pom in Get-ChildItem -Recurse -Depth 1 -Filter pom.xml) {
            $text = [IO.File]::ReadAllText($pom.FullName).Replace('${revision}', '0.1.0') -replace '(?m)^[ \t]*<revision>.*</revision>[ \t]*\r?\n', ''
            [IO.File]::WriteAllText($pom.FullName, $text)
          }
          if (Select-String -Path pom.xml -Pattern revision -Quiet) { Write-Output "::error title=no revision::pom.xml still names a revision"; exit 1 }
          cmd /c "scripts\windows\package.bat -q -DskipTests" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\step.log"
          if ($LASTEXITCODE -ne 0) { & $env:REPORT 'package.bat, no revision' "$env:RUNNER_TEMP\step.log"; exit 1 }
          if (-not (Test-Path releases\demo-0.1.0-windows.zip)) { Write-Output "::error title=package.bat, no revision::no releases\demo-0.1.0-windows.zip"; exit 1 }
          git checkout -- .
      - name: Options jtools.conf declares - package.bat --quick adds its Maven arguments, checks and cleans its archives
        working-directory: ${{ runner.temp }}\demo
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Content -Path jtools.conf -Value "PACKAGE_OPTION=quick -DskipTests`r`nPACKAGE_ARCHIVES=quick -quick.txt"
          Set-Content releases\demo-0.0.9-quick.txt old; Set-Content releases\demo-0.1.0-quick.txt made
          cmd /c "scripts\windows\package.bat --quick -Djtools.ci.probe=a=b -q" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\step.log"
          if ($LASTEXITCODE -ne 0) { & $env:REPORT 'package.bat --quick' "$env:RUNNER_TEMP\step.log"; exit 1 }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\step.log" -SimpleMatch '--quick: demo-0.1.0-quick.txt' -Quiet)) { & $env:REPORT 'package.bat --quick: no line for its archive' "$env:RUNNER_TEMP\step.log"; exit 1 }
          if ((Test-Path releases\demo-0.0.9-quick.txt) -or -not (Test-Path releases\demo-0.1.0-quick.txt)) { Write-Output "::error title=package.bat --quick::the previous version's archive kept, or this version's removed"; exit 1 }
          if (Get-ChildItem -Directory -Path */target/surefire-reports -ErrorAction SilentlyContinue) { Write-Output "::error title=package.bat --quick::tests ran: -DskipTests did not reach Maven"; exit 1 }
          Remove-Item releases\demo-0.1.0-quick.txt
          cmd /c "scripts\windows\package.bat --quick -q" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\step.log"
          if ($LASTEXITCODE -eq 0) { Write-Output "::error title=package.bat --quick::a missing declared archive passed"; exit 1 }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\step.log" -SimpleMatch 'no releases\demo-0.1.0-quick.txt: --quick makes it' -Quiet)) { & $env:REPORT 'package.bat --quick: not the missing archive' "$env:RUNNER_TEMP\step.log"; exit 1 }
          git checkout -- .
      - name: run.bat builds when a file changed, and only then (Windows' archive marks)
        working-directory: ${{ runner.temp }}\demo
        run: |
          $ErrorActionPreference = 'Continue'
          $runs = @()
          foreach ($touch in $false, $false, $true) {
            # a file saved as an editor saves it: its text written again, which marks it "to archive"
            if ($touch) { $f = (Resolve-Path pom.xml).Path; [IO.File]::WriteAllText($f, [IO.File]::ReadAllText($f)); Write-Output "pom.xml: $((Get-Item $f).Attributes)" }
            cmd /c "scripts\windows\run.bat --help" > "$env:RUNNER_TEMP\step.log" 2>&1
            if ($LASTEXITCODE -ne 0) { & $env:REPORT 'run.bat --help' "$env:RUNNER_TEMP\step.log"; exit 1 }
            $runs += (Get-Content "$env:RUNNER_TEMP\step.log" -Raw).Contains('== building')
          }
          Write-Output "built: $runs"
          if (-not ($runs[0] -and -not $runs[1] -and $runs[2])) { Write-Output "::error title=run.bat's rebuilds::built on the three runs: $runs - expected True, False, True"; exit 1 }
      - name: The same project as Linux's, but for its line endings
        run: |
          $ErrorActionPreference = 'Continue'
          cmd /c "`"$env:USERPROFILE\.local\bin\jtools.bat`" new Demo --dir `"$env:RUNNER_TEMP\fresh`" --port 18096 --no-git --no-build" 2>&1 | Tee-Object -FilePath step.log
          if ($LASTEXITCODE -ne 0) { & $env:REPORT 'jtools new' step.log; exit 1 }
          & 'C:\Program Files\Git\usr\bin\diff.exe' -r --strip-trailing-cr made-on-linux "$env:RUNNER_TEMP\fresh" 2>&1 | Tee-Object -FilePath step.log
          if ($LASTEXITCODE -ne 0) { & $env:REPORT "differs from Linux's" step.log; exit 1 }
      - name: Without git, a project without a repository
        run: |
          $ErrorActionPreference = 'Continue'
          $env:Path = (($env:Path -split ';') | Where-Object { $_ -notmatch '\\Git\\' }) -join ';'
          cmd /c "`"$env:USERPROFILE\.local\bin\jtools.bat`" new NoGit --dir `"$env:RUNNER_TEMP\nogit`" --no-build" 2>&1 | Tee-Object -FilePath step.log
          if ($LASTEXITCODE -ne 0 -or (Test-Path "$env:RUNNER_TEMP\nogit\.git") -or -not (Test-Path "$env:RUNNER_TEMP\nogit\pom.xml")) { & $env:REPORT 'jtools new without git' step.log; exit 1 }
      - name: A project made with 1.3.1, moved to 1.4's layout by its own scripts\jtools sync
        run: |
          $ErrorActionPreference = 'Continue'
          function Report($title) { & $env:REPORT $title "$env:RUNNER_TEMP\step.log"; exit 1 }
          Invoke-WebRequest -UseBasicParsing -Uri https://github.com/j4ckk0/JToolsFramework/releases/download/v1.3.1/jtools-1.3.1.zip -OutFile old.zip
          Expand-Archive -Path old.zip -DestinationPath old-delivery
          $version = (Get-Content (Get-Item jtools-*\VERSION).FullName).Trim()
          cmd /c "old-delivery\jtools-1.3.1\install.bat --no-project" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\step.log"
          if ($LASTEXITCODE -ne 0) { Report 'install.bat 1.3.1' }
          cmd /c "old-delivery\jtools-1.3.1\jtools.bat new Old --dir `"$env:RUNNER_TEMP\old`" --port 18095 --no-git --no-build" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\step.log"
          if ($LASTEXITCODE -ne 0) { Report 'jtools 1.3.1 new' }
          Set-Location "$env:RUNNER_TEMP\old"
          (Get-Content jtools.conf) -replace '^JTOOLS_VERSION=.*', "JTOOLS_VERSION=$version" | Set-Content jtools.conf
          (Get-Content pom.xml -Raw).Replace('<version>1.3.1</version>', "<version>$version</version>") | Set-Content pom.xml -NoNewline
          cmd /c "scripts\jtools.bat sync" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\step.log"
          if ($LASTEXITCODE -ne 0) { Report 'scripts\jtools sync, from 1.3.1' }
          foreach ($f in 'scripts\windows\run.bat', 'scripts\linux\run.sh', 'scripts\windows\jtools.bat') { if (-not (Test-Path $f)) { Write-Output "::error title=moved::$f is missing"; exit 1 } }
          foreach ($f in 'scripts\run.bat', 'scripts\run.sh') { if (Test-Path $f) { Write-Output "::error title=moved::$f is still there"; exit 1 } }
          Remove-Item scripts\jtools, scripts\jtools.bat
          $env:JTOOLS_DOWNLOADS = "$env:RUNNER_TEMP\demo\external\downloads"
          foreach ($command in 'scripts\windows\jtools.bat sync --check', 'scripts\windows\setup.bat', 'scripts\windows\build.bat -q') {
            cmd /c $command 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\step.log"
            if ($LASTEXITCODE -ne 0) { Report $command }
          }
      - name: Git Bash's shell scripts, on Windows too, on a project the .bat scripts made (its files CRLF)
        shell: bash
        working-directory: ${{ runner.temp }}/demo
        run: |
          scripts/linux/build.sh -q > "$RUNNER_TEMP/bash.log" 2>&1 || { e=$(tail -60 "$RUNNER_TEMP/bash.log" | sed 's/%/%25/g' | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g'); echo "::error title=scripts/linux/build.sh in Git Bash::$e"; exit 1; }
