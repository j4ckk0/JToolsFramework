<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Todo</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
    input, button { font: inherit; padding: .3rem .6rem; }
    li.done { text-decoration: line-through; color: #888; }
    #error { color: #b00; }
  </style>
</head>
<body>
  <h1>To do</h1>
  <form id="add"><input id="title" placeholder="something to do" autofocus> <button>Add</button></form>
  <p id="error"></p>
  <ul id="list"></ul>
  <script>
    // The page's presence: the server stops 15 seconds after the last page has gone.
    const page = crypto.randomUUID();
    new EventSource('/api/alive?id=' + page);
    addEventListener('pagehide', () => navigator.sendBeacon('/api/bye?id=' + page));

    // The page holds no state and applies no rule: it shows what the server answers, and says a refusal as it is.
    async function ask(path, body) {
      const answer = await fetch(path, body === undefined ? {} : { method: 'POST', body: JSON.stringify(body) });
      const json = await answer.json();
      if (!answer.ok) throw new Error(json.error);
      return json;
    }
    async function show() {
      const list = document.getElementById('list');
      list.replaceChildren(...(await ask('/api/todos')).map((todo) => {
        const item = document.createElement('li');
        item.textContent = todo.title + ' ';
        if (todo.done) item.className = 'done';
        else {
          const done = document.createElement('button');
          done.textContent = 'Done';
          done.onclick = () => ask('/api/todos/done?id=' + todo.id, {}).then(show);
          item.append(done);
        }
        return item;
      }));
    }
    document.getElementById('add').onsubmit = async (event) => {
      event.preventDefault();
      const title = document.getElementById('title');
      try {
        await ask('/api/todos', { title: title.value });   // an empty title: the server refuses it, and says why
        title.value = '';
        document.getElementById('error').textContent = '';
      } catch (e) {
        document.getElementById('error').textContent = e.message;
      }
      show();
    };
    show();
  </script>
</body>
</html>
