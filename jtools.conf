# What the managed scripts (scripts/linux/*.sh, scripts/windows/*.bat) know of this project: KEY=VALUE lines, # comments, a value is the
# rest of its line. doc/DEVKIT.md says what each key does.
#
# The framework is libraries, not a program: no APP_ID (run, stop and package say so). Its build installs its
# artifacts into the local Maven repository (~/.m2), where the projects find them.
APP_ID=
APP_NAME=JToolsFramework
BUILD_GOALS=clean install
# its own devkit, as its working tree is: scripts/linux/jtools sync --check (scripts/linux/ci.local.sh) keeps scripts/ equal to devkit/
JTOOLS_HOME=.
