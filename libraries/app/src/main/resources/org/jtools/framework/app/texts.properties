# What jtools-app says to the user (the console, the failure dialog, the settings' refusals), in their language:
# --lang, else the machine's. The log's lines are in English, and not here.
usage=Usage: {0} {1}
option.port=the port to serve on (default: the Settings menu's, else {0}'s, else {1}; 0 for any free one)
option.host=the interface to listen on (default {0}: this computer only)
option.noBrowser=do not open the browser, and keep running: open the page by hand
option.keepAlive=keep running once the last page is closed (by default, {0} then stops)
option.logLevel=SEVERE, WARNING, INFO (the default), FINE (every request), ...
option.verbose=the same as --log-level FINE
option.logFile=the log's file (default: ~/.{0}/logs/{0}.0.log)
option.lang=the language of these messages: {0}
option.help=this help
error.unknownOption=unknown option: {0}
error.valueExpected={0} takes a value
error.notAPort={0}: not a port: {1}
error.notALevel={0}: not a level: {1}
error.notAFile=not a file: {0}
error.oneOperand=one {0} only
error.badLanguage={0}: not one of {1}
error.ini={0}: {1}
error.portInUse=Port {0} is in use: is {1} already running? Open {2}, or choose another port with --port N.
error.cannotStart={0} cannot start: {1}
settings.autoStop=autoStop: true or false
settings.port=port: 0, or 1 to 65535
log.notHere=the log is opened only on the computer the program runs on
log.none=this run keeps no log file
